name: Atualizar contribuições públicas
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Atualizar a arte com dados públicos reais
        env:
          GITHUB_PROFILE_USERNAME: Matheuslinspg3
        run: python scripts/update_contributions.py
      - name: Commitar somente alterações reais
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh contribution chart [skip ci]'
            git push origin HEAD:main
          fi
